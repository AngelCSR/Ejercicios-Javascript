<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Uno</p>
    <p>Dos</p>
    <p>Tres</p>

    <script>
        let parrafos=document.querySelectorAll("p");

        parrafos.forEach(parrafo=>{
            parrafo.addEventListener("click",verTexto);
        });

        function verTexto(evento){//el objeto evento tiene toda la informacion del evento que se ha producido
            alert(evento.target.textContent);
            console.log(evento);
        }

    </script>
</body>
</html>
