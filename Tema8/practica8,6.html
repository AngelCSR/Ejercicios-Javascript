   <script>
        /*
        Panel con el mensaje "cargando"
        • rea una página que coja de Internet 10 imágenes de alta calidad
        • Se mostrará un panel con el mensaje "Cargando..." durante la carga.
        • El panel se retira automáticamente cuando se cargan todas las imágenes
        */
       let texto=document.querySelector("h2");
       window.addEventListener("load",(ev)=>{
        setTimeout(()=>{//espera 2 segundos para ver el mensaje para que si va demasiado rapido se vea
            texto.innerText="";
        },2000);     
        
       })
