<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
    <script>

        for (let i = 0; i < 2000; i++) {
            let x = Math.floor(Math.random() * (window.innerWidth ));  // horizontal
            let y = Math.floor(Math.random() * (window.innerHeight)); // vertical
            let rojo = Math.floor(Math.random() * 256);
            let verde = Math.floor(Math.random() * 256);
            let azul = Math.floor(Math.random() * 256);
            document.write(`<div style='background-color:rgb(${rojo},${verde},${azul}); top:${y}px; left:${x}px; width:50px; height:50px; position:fixed;'></div>`);
        }
    </script>
</body>

</html>
