<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /* Funcion para detectar palindromos ignorando signos de puntuacion,
         tildes y dialisis y no se distingue entre mayusculas y minusculas*/

        function esPalindromo(str) {
            // Convertir a minúsculas y eliminar signos de puntuación y espacios
            let strLimpio = str.toLowerCase().replace(/[\W_]/g, '');
            let strReverso = strLimpio.split('').reverse().join('');
            return strLimpio === strReverso;
        }

    </script> 
</body>
</html>
