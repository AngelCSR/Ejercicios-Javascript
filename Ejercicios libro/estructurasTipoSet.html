<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>
        /*Los Sets (que se pueden traducir con conjuntos) son una estructura de datos que
        (son objetos real­
        mente) que permiten, de forma similar a los arrays, almacenar datos. Es una estructura de datos
        que apareció en el estándar ES2015-
        */
        let miSet = new Set();
        console.log(miSet);
        //Añadir elementos a un Set (numeros en este caso)
        console.log("Añado al set 5,7,5,9");//0
        miSet.add(5);
        miSet.add(7);
        miSet.add(5);//no se añade porque ya existe
        miSet.add(9);
        console.log(miSet);
        //tambien se pueden añadir asi
        console.log("Añado al set 11,13,15");
        miSet.add(11).add(13).add(15);
        console.log(miSet);
        //tambien se puede crear con elementos
        console.log("Creo un set con 3 elementos (1,2,3)");
        let otroSet = new Set([1, 2, 3]);
        console.log(otroSet);
       
        //saber cuantos elementos tiene un Set
        console.log("Mostramos el tamaños del set (miSet.size) ");
        console.log(miSet.size);
        //saber si un elemento existe en el Set
        console.log("Saber si existen los elementos 7 y 8 en el Set (miSet.has(7) y miSet.has(8))");
        console.log(miSet.has(7));
        console.log(miSet.has(8));
        //eliminar un elemento del Set
        console.log("Elimino el elemento 7 del Set (miSet.delete(7))");
        miSet.delete(7);
        console.log(miSet);
        console.log("Saber si existe el elemento 7 en el Set (miSet.has(7))");
        console.log(miSet.has(7));
        //recorrer los elementos de un Set
        console.log("Recorrer los elementos del Set (for..of)");
        for (let numero of miSet) {
            console.log(numero);
        }
        //recorrer los elementos de un Set con forEach
        console.log("Recorrer los elementos del Set (forEach)");
        miSet.forEach(numero => console.log(numero));
        //convertir un Set en un Array
        console.log("Convertir un Set en un Array (Array.from(miSet))");
        let arrayDesdeSet = Array.from(miSet);
        let arrayDesdeSet2=[...miSet]
        console.log(arrayDesdeSet);
        //convertir un Array en un Set
        console.log("Convertir un Array en un Set (new Set(arrayDesdeSet))");
        let setDesdeArray = new Set(arrayDesdeSet);
        console.log(setDesdeArray);
         //unir dos sets
        console.log("Uno los dos sets (miSet y otroSet)");
        let unionSet = new Set([...miSet, ...otroSet]);
        console.log(unionSet);
        //eliminar todos los elementos del Set
        console.log("Elimino todos los elementos del Set (miSet.clear())");
        miSet.clear();
        console.log(miSet); //Set vacío
        console.log(miSet.size); //0


    </script>
</body>

</html>
