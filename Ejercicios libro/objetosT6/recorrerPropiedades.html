<body>
    <script>

        function doblarX() {//función que dobla la x del objeto que la invoque, solo funciona si se llama desde un objeto
            this.x *= 2;
        }
        let punto = {
            x: 19,
            y: 36,
            mostrarCoordenadas: function () {
                return `(${this.x},${this.y}`;
            }
        };

        for (let prop in punto) {//esta función recorre todas las propiedades del objeto 'punto'
            if(typeof punto[prop]!="function"){
            // Si la propiedad no es una función, muestra su nombre y valor
            console.log(`${prop} tiene el valor ${punto[prop]}`);
            }
        }
    </script>
