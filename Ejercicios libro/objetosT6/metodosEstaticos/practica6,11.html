<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
         //Función constructora
        function Carta(palo, valor) {

            if (palo>0 && palo<5 && typeof(palo)==="number"){
                this.palo = parseInt(palo);
            } else{
                return null
            }

            if (valor>0 && valor <11 && typeof(valor)==="number"){
                this.valor =parseInt(valor);
            } else{
                return null
            }

            this.darValor= function(palo,valor){
                 if (palo>0 && palo<5 && typeof(palo)==="number"){
               
                    if (valor>0 && valor <11 && typeof(valor)==="number"){
                        this.palo = parseInt(palo);
                        this.valor =parseInt(valor);
                    } 
                } 


            }

            this.toString=function(){
                let texto=""
                
                switch (this.valor){

                    case 1:
                        texto="As"
                        break
                    case 2:
                    case 3: 
                    case 4: 
                    case 5: 
                    case 6: 
                    case 7:   
                        texto=this.valor
                        break
                    case 8: 
                        texto="Sota"
                        break
                    case 9: 
                        texto="Caballo"
                        break
                    case 10:
                        texto="Rey"
                        break
                    default: 
                        texto="Palo erroneo"
                    
                   

                }
                 texto+=" de "
                 switch (this.palo){

                    case 1: 
                        texto+="Oros"
                        break
                    case 2: 
                        texto+="Espadas"
                        break
                    case 3: 
                        texto+="Bastos"
                        break
                    case 4: 
                        texto+="Copas"
                        break
                    default: 
                        texto="Palo erroneo"

                 }

                 return texto
                    
            }
            
            
            
             }

        function Baraja(){
            this.cartas=[]

            for (let i=1;i<5;i++){
                //este bucle recorre cada palo
                for(let j=1;j<11;j++){
                    this.cartas.push(new Carta(i,j))

                }
            }

            this.toString=function(){
                for(let c of this.cartas){
                   console.log(c.toString())
                }
            }

            this.barajar=function(){
                /*
                Calcular un numero aleatorio entra 0 y 39
                extraer una carta de esa posicion
                meterla al final de la baraja
                */
                for(let i=0;i<100;i++){
                    let=num=parseInt(Math.random()*40)
                    let carta = this.cartas.splice(num, 1)[0]; //Esto le pasa solo el objeto en la posicion 0 del array que devuelve el metodo
                    // ponerla al final
                    this.cartas.push(carta);

                }

            }
        }

        let baraja1=new Baraja()
        console.log("----------------Sin Barajear--------------")
        baraja1.toString()
        baraja1.barajar()
        console.log("----------------Barajeada--------------")
        baraja1.toString()
    </script>
