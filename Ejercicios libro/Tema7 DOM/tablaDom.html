<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #4c1d95, #0f172a);
    min-height: 100vh;
    margin: 0;
    padding: 30px;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

label {
    font-size: 18px;
    margin-right: 8px;
}

input {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.2);
    color: white;
    backdrop-filter: blur(4px);
    transition: all 0.2s;
}

input:focus {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
}

button {
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    color: white;
    background: linear-gradient(90deg, #7c3aed, #4f46e5);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: 0.2s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

table {
    margin-top: 20px;
    border-collapse: collapse;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(5px);
    border-radius: 12px;
    overflow: hidden;
}

td, th {
    padding: 12px 20px;
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 16px;
}

tr:hover {
    background: rgba(255,255,255,0.25);
}
    </style>

</head>
<body>
    <label for="filas">Filas   </label>
    <input id="filas" type="number"><br>
    <label for="cols">Columnas</label>
    <input id="cols" type="number"><br>
    <button onclick="crearTabla()">Crear tabla</button>
    <script>
        let tabla=document.createElement("table")
        document.querySelector("body").appendChild(tabla)

        function crearTabla(){
            tabla.innerHTML=" "
            let filas=document.getElementById("filas").value
            let columnas=document.getElementById("cols").value

            for(let i=0;i<filas; i++){
                let fila=document.createElement("tr")

                for(let j=0;j<columnas;j++){
                    let col=document.createElement("td")
                    col.innerText=j
                    fila.appendChild(col)
                }

                 tabla.appendChild(fila)
            }

        }
    </script>
</body>
</html>
