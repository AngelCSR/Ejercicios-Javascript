<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindro</title>
</head>
<body>
    <script>
        /*
        Crea una aplicación web que lea un texto e indique si el mismo es un palíndromo.
        • Un palíndromo es un texto que se lee igual de derecha a izquierda que de izquierda a derecha
        • Ejemplos de palíndromos:
        - Dábale arroz a la zorra el abad
        - Logré ver gol
        - Luz azul
        - ¿Son muías o cívicos alumnos?
        - Lo sé, Dama de Sol.
        • Hay que tener en cuenta que para que se consideren bien los palíndromos, se ignoran los
        signos de puntuación (espacios, interrogaciones, comas, puntos, etc.) también se ignoran
        tildes y diéresis (se considera igual el carácter á que el carácter a) y no se distingue entre
        mayúsculas y minúsculas.
        */

        let text=prompt("Introduce un texto para saber si es un palindromo")
        
          // 1️ Normalizar el texto
    // Convertir a minúsculas
    text = text.toLowerCase();

    //  Eliminar tildes y diéresis
    text = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    // Eliminar todo lo que no sea letra o número
    text = text.replace(/[^a-z0-9]/g, "");

    
    textInvertido=text.split("").reverse().join("")

    if(text==textInvertido){
        document.write("El texto es palindromo")
    }else(
        document.write("El texto no es palindromo")
    )



    </script>
</body>
</html>
