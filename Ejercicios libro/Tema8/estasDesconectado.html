<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Con conexión</h1>

    <script>
        let texto=document.querySelector("h1");
        window.addEventListener("online",()=>{//cuando se conecta
            texto.textContent="Con conexión";
        });
        window.addEventListener("offline",()=>{//cuando se desconecta
            texto.textContent="Desconectado";
        });
    </script>
</body>
</html>
