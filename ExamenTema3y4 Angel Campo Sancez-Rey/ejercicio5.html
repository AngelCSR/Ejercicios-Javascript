<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function esPrimo(n) {
            if (n < 2){
                return false;
            } 

            // Recorremos todos los números desde 2 hasta el numero - uno
            for (let i = 2; i < n; i++) {
                if (n % i == 0) {
                return false; // Si encuentra un divisor  no es primo
                }
            }
            return true; // Si no encuentra divisor si es primo
        }

        numero=parseInt(prompt("Introduce un numero: "))
        while(numero>=2){
            if(esPrimo(numero)==true){
              
                console.log("El numero "+numero+" es primo")
            }
            numero--
        }
    </script>
</body>
</html>
