    <script>
        /*Programa que sirva para jugar a la palabra secreta*/
        const secreta= "luna"
        //crear una variable solucuion con los * que tenga de caracteres la palabra secreta
        let solucion=""

        for(let i=0; i< secreta.length;i++){
            solucion+="*"
        }
        let soluArray=solucion.split("")
        //bucle que se repita hasta que el usuario adivine todas las letras de la palabra secreta, cmbiando la letra adivinada en la variable solucion en la posicion correcta
        //para palabras sin repeticion de letra
        while(solucion!=secreta){
            let letra=prompt(solucion+"; Introduce una letra")
            if(secreta.includes(letra)){
                soluArray[secreta.indexOf(letra)]=letra
                solucion=soluArray.join("")
            }

        }
