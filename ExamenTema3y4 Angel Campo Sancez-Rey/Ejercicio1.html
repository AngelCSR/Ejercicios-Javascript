<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let txt=prompt("Introduce un texto: ")
        let mapa= new Map()
        let array=[]
        let cont=0
        let cont2=1
        for (let i=0;i<txt.length;i++){
            array[i]=txt.charAt(i)

        }
        for(let letra of array){
            
            if(letra==array[cont]){
                mapa.set(letra,cont2)
                cont2++
            }
            
            cont++
        }
        document.write(mapa)
        console.log(mapa)
    </script>
</body>
</html>
