<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="p"></p>
    <script>
        let num=Number(prompt("Introduce un numero: "))
        let t="";
        for(let i=0;i<11;i++){
            console.log(num+" x "+i+" = "+num*i);
            document.write(`${num} x ${i}= ${num*i}<br>`)
            t+=`${num} x ${i}= ${num*i}\n`
        }
        alert(t);
    </script>
</body>
</html>
