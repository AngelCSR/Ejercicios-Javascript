<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let iban=prompt("Numero de cuenta")
        let expr2 = /ES\d{2}\-\d{4}\-\d{4}\-\d{2}\-\d10i/
        if(expr2.test(iban)){
            document.write("Numero correct")
        }else
        {
            document.write("Numero incorrecto")
        }

    </script>
</body>
</html>
