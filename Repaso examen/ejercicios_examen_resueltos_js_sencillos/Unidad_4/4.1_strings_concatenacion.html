<body>
  <h1>4.1 - Strings y concatenación</h1>
  <p><strong>Enunciado:</strong> Combina nombre y apellido de un estudiante y muestra longitud de la cadena resultante.</p>
  <div id="page"></div>
  <pre id="log"></pre>
  <script>
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.join(' ') + '\n'; }


let nombre = "Juan";
let apellido = "Pérez";
let completo = nombre + " " + apellido;
writePage("Nombre completo: " + completo);
writePage("Longitud total: " + completo.length);
writeLog("Nombre completo:", completo, "Longitud:", completo.length);


  </script>
