<body>
  <h1>3.7 - Bucle while y if combinados</h1>
  <p><strong>Enunciado:</strong> Dado un número inicial 1, imprimir los números del 1 al 5 indicando si son pares o impares usando while y if.</p>
  <div id="page"></div>
  <pre id="log"></pre>
  <script>
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.join(' ') + '\n'; }


let i = 1;
while(i <= 5) {
  // Determinar si el número es par o impar
  if(i % 2 === 0) {
    writePage(i + " es par");
    writeLog(i, "par");
  } else {
    writePage(i + " es impar");
    writeLog(i, "impar");
  }
  i++;
}


  </script>
</body>
