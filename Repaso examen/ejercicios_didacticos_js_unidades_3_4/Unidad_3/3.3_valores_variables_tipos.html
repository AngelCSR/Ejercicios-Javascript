  <h1>3.3 - Valores, declaración de variables y tipos de datos primitivos</h1>
  <p class="note"><strong>Guía didáctica:</strong> Sigue los comentarios en el código para entender cada paso.</p>
  <h2>Salida en pantalla</h2>
  <div id="page"></div>
  <h2>Salida en consola / logs</h2>
  <pre class="output" id="log"></pre>
  <script>
    // Helper sencillo para mostrar en pantalla y consola
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') + '\n'; }


// Paso 1: Declarar variables con var, let y const explicando diferencias (básico)
// 'var' existe históricamente en JavaScript; puede tener alcance global o de función.
var antiguo = "uso histórico, evita su uso en código moderno cuando sea posible";

// 'let' se usa para variables cuyo valor puede cambiar y tiene alcance de bloque.
let contador = 1; // ejemplo de variable cambiante

// 'const' se usa para valores constantes que no deben reasignarse.
const PI = 3.1416; // convención: mayúsculas para constantes

// Paso 2: Tipos primitivos simples
let cadena = "Hola";
let numero = 42;
let booleano = false;
let indefinido; // variable declarada pero sin asignar -> undefined
let nulo = null; // valor nulo explícito

// Mostrar en pantalla y consola con descripciones
writePage("var (histórico): " + antiguo);
writePage("let contador: " + contador);
writePage("const PI: " + PI);
writePage("cadena, numero, booleano, indefinido, nulo:");
writePage(cadena + ", " + numero + ", " + booleano + ", " + indefinido + ", " + nulo);
writeLog("Tipos primitivos:", {cadena, numero, booleano, indefinido, nulo});


  </script>
