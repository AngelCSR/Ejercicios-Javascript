  <h1>3.5 - Conversión de tipos (automática y forzada) e isNaN</h1>
  <p class="note"><strong>Guía didáctica:</strong> Sigue los comentarios en el código para entender cada paso.</p>
  <h2>Salida en pantalla</h2>
  <div id="page"></div>
  <h2>Salida en consola / logs</h2>
  <pre class="output" id="log"></pre>
  <script>
    // Helper sencillo para mostrar en pantalla y consola
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') + '\n'; }


// Conversión automática (coerción)
// Cuando se combinan tipos, JavaScript intenta convertirlos automáticamente.
let mezcla1 = "5" + 2; // concatena -> '52' (string)
let mezcla2 = "5" * 2; // multiplica -> 10 (número), porque '*' no concatena

// Forzar conversiones explícitas
let n = Number("123"); // convierte cadena a número
let s = String(456); // convierte número a cadena
let b = Boolean(0); // 0 -> false, otros números -> true

// isNaN: determina si un valor NO es un número
let prueba1 = isNaN("hola"); // true, porque 'hola' no se convierte a número
let prueba2 = isNaN("123"); // false, '123' convertible a número
// Nota: Number.isNaN es más fiable en algunos casos; aquí usamos isNaN básico visto en el temario

// Mostrar resultados
writePage("Coerción: '5' + 2 = " + mezcla1);
writePage("'5' * 2 = " + mezcla2);
writePage("Number('123') = " + n + ", String(456) = " + s + ", Boolean(0) = " + b);
writePage("isNaN('hola') = " + prueba1 + ", isNaN('123') = " + prueba2);
writeLog("Coerción y conversiones", {mezcla1, mezcla2, n, s, b, prueba1, prueba2});


  </script>
