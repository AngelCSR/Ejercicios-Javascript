  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 1.5rem; line-height: 1.6; }
    pre.output { background:#0b1220; color:#e6eef8; padding:1rem; border-radius:.5rem; overflow:auto; }

<body >
  <a href="../index.html">← Volver al índice</a>
  <h1>3.1.1 - Ejecutar código JavaScript en el navegador</h1>
  <p class="note"><strong>Guía didáctica:</strong> Sigue los comentarios en el código para entender cada paso.</p>
  <h2>Salida en pantalla</h2>
  <div id="page"></div>
  <h2>Salida en consola / logs</h2>
  <pre class="output" id="log"></pre>
  <script>
    // Helper sencillo para mostrar en pantalla y consola
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') + '\n'; }


// Introducción: al cargar esta página, el código JavaScript dentro de la etiqueta <script> se ejecuta.
// Paso 1: mostrar un mensaje en la página usando writePage (equivalente a document.write simplificado).
writePage("¡Hola! Este mensaje viene de JavaScript ejecutado en el navegador.");
// Paso 2: mostrar el mismo mensaje en la consola (útil para depuración)
writeLog("Mensaje desde la consola: Hola desde JavaScript en el navegador");
// Nota: No usamos funciones definidas por el estudiante aún, solo llamadas directas.


  </script>
  <footer style="margin-top:1rem;color:#6b7280;font-size:.9rem">Parte del paquete de ejercicios didácticos — Unidades 3 y 4.</footer>
</body>
