  <h1>3.2 - Fundamentos básicos (conceptos fundamentales)</h1>
  <p class="note"><strong>Guía didáctica:</strong> Sigue los comentarios en el código para entender cada paso.</p>
  <h2>Salida en pantalla</h2>
  <div id="page"></div>
  <h2>Salida en consola / logs</h2>
  <pre class="output" id="log"></pre>
  <script>
    // Helper sencillo para mostrar en pantalla y consola
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') + '\n'; }


// Paso 1: Definimos valores simples (números y cadenas)
// Comentario extenso: Un 'valor' es cualquier dato que JavaScript entiende: números, cadenas, booleanos, etc.
// Aquí sólo declaramos valores, sin estructuras complejas.
let numero = 7; // número entero
let texto = "Este es un texto"; // cadena de caracteres
let booleano = true; // valor lógico

// Paso 2: mostrar en pantalla y en la consola
writePage("Número: " + numero);
writePage("Texto: " + texto);
writePage("Booleano: " + booleano);
writeLog("Valores ->", {numero: numero, texto: texto, booleano: booleano});


  </script>
