  <h1>4.6 - Introducción básica a Map (colección clave-valor)</h1>
  <p class="note"><strong>Guía didáctica:</strong> Sigue los comentarios en el código para entender cada paso.</p>
  <h2>Salida en pantalla</h2>
  <div id="page"></div>
  <h2>Salida en consola / logs</h2>
  <pre class="output" id="log"></pre>
  <script>
    // Helper sencillo para mostrar en pantalla y consola
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') + '\n'; }


// Crear un mapa simple con parejas clave-valor
let mapa = new Map();
mapa.set("nombre", "Lola");
mapa.set("edad", 30);

// Acceder a valores por clave con get
let nombre = mapa.get("nombre");
let edad = mapa.get("edad");

writePage("Clave 'nombre' -> " + nombre);
writePage("Clave 'edad' -> " + edad);
writeLog("Mapa entries:", Array.from(mapa.entries()));


  </script>
