  <h1>4.4 - Métodos básicos de arrays (añadir, quitar, slice simple)</h1>
  <p class="note"><strong>Guía didáctica:</strong> Sigue los comentarios en el código para entender cada paso.</p>
  <h2>Salida en pantalla</h2>
  <div id="page"></div>
  <h2>Salida en consola / logs</h2>
  <pre class="output" id="log"></pre>
  <script>
    // Helper sencillo para mostrar en pantalla y consola
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') + '\n'; }


// Empezamos con array base
let arr = [1,2,3];
writePage("Array inicial: " + arr);
writeLog("Inicial:", arr);

// push: añadir al final
arr.push(4); // añade 4 al final
writePage("Tras push(4): " + arr);
writeLog("push:", arr);

// pop: quitar el último elemento
let ultimo = arr.pop(); // devuelve y elimina el último elemento
writePage("Elemento extraído con pop(): " + ultimo + ". Array ahora: " + arr);
writeLog("pop result:", ultimo, arr);

// unshift: añadir al principio
arr.unshift(0);
writePage("Tras unshift(0): " + arr);
writeLog("unshift:", arr);

// shift: quitar el primero
let primero = arr.shift();
writePage("Elemento extraído con shift(): " + primero + ". Array ahora: " + arr);
writeLog("shift result:", primero, arr);

// slice: obtener subarray sin modificar el original
let sub = arr.slice(0,2);
writePage("Subarray con slice(0,2): " + sub);
writeLog("slice:", sub);


  </script>
