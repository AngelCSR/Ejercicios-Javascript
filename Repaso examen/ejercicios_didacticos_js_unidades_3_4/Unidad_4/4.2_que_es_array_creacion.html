  <h1>4.2 - ¿Qué es un array? y creación básica</h1>
  <p class="note"><strong>Guía didáctica:</strong> Sigue los comentarios en el código para entender cada paso.</p>
  <h2>Salida en pantalla</h2>
  <div id="page"></div>
  <h2>Salida en consola / logs</h2>
  <pre class="output" id="log"></pre>
  <script>
    // Helper sencillo para mostrar en pantalla y consola
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') + '\n'; }


// Creación de un array literal con valores básicos
let numeros = [10, 20, 30]; // array con 3 elementos

// Acceso por índice (empezando en 0)
writePage("Array completo: " + numeros);
writePage("Primer elemento (índice 0): " + numeros[0]);
writeLog("Array y primer elemento:", numeros, numeros[0]);

// Mostrar longitud básica con .length
writePage("Longitud del array: " + numeros.length);
writeLog("length:", numeros.length);


  </script>
