  <h1>4.1.2 - Comparación y métodos básicos de strings</h1>
  <p class="note"><strong>Guía didáctica:</strong> Sigue los comentarios en el código para entender cada paso.</p>
  <h2>Salida en pantalla</h2>
  <div id="page"></div>
  <h2>Salida en consola / logs</h2>
  <pre class="output" id="log"></pre>
  <script>
    // Helper sencillo para mostrar en pantalla y consola
    const page = document.getElementById('page');
    const logEl = document.getElementById('log');
    function writePage(txt) { page.innerHTML += txt + '<br>'; }
    function writeLog() { const args = Array.from(arguments); logEl.textContent += args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ') + '\n'; }


// Comparación simple (alfabética)
writePage("'a' < 'b' ? " + ('a' < 'b'));
writeLog("'a' < 'b' ->", 'a' < 'b');

// Métodos básicos de cadena: trim, toUpperCase, toLowerCase, includes
let ejemplo = "  JavaScript básico  ";
writePage("Original: '" + ejemplo + "'");
writePage("Trim: '" + ejemplo.trim() + "'");
writePage("Mayúsculas: '" + ejemplo.trim().toUpperCase() + "'");
writePage("Contiene 'básico'?: " + ejemplo.includes("básico"));
writeLog("String methods demo:", {original: ejemplo, trimmed: ejemplo.trim()});


  </script>
