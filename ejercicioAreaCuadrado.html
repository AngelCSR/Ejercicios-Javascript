<body>
    <script>
        let lado =Number(prompt("Introduce el lado del cuadrado: "));
        if(isNaN(lado)){
            alert("DATO ERRONEO")
        }else{
       alert ("El area de este cuadrado es: "+(lado*lado)+"m2");//lado**2(** es elevado)
       //alert (`El area de este cuadrado  es: (${lado}*${lado}*)m2`);tambien se puede hace con ``
        }
    </script>
    
</body>
